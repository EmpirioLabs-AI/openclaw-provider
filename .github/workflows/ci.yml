name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    name: Build, test, and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          contents="$(tar -tzf "$tarball")"
          for file in package/dist/index.js package/openclaw.plugin.json package/assets/icon.png package/README.md package/LICENSE; do
            grep -qx "$file" <<<"$contents" || { echo "::error::$file is missing from $tarball"; exit 1; }
          done
          if grep -q '^package/src/' <<<"$contents"; then
            echo "::error::TypeScript sources should not be published"
            exit 1
          fi

      - name: Validate with the ClawHub plugin inspector
        run: npx --yes clawhub@0.23.3 package validate .

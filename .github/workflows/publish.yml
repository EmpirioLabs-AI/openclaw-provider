# Publishes @empiriolabs/openclaw-provider to npm and ClawHub when a version tag
# such as 0.1.0 is pushed. Both registries receive the same npm-pack tarball,
# built once from the tagged commit.
#
# Release time: the build regenerates src/generated/fallback-catalog.ts from the
# live public catalog (GET https://api.empiriolabs.ai/v1/models), so the offline
# fallback that ships is current. If the catalog cannot be reached, the release
# fails instead of shipping a stale fallback.
#
# npm, with provenance, through trusted publishing only (OIDC, no secret). On
# npmjs.com the package's trusted publisher is EmpirioLabs-AI /
# openclaw-provider / publish.yml (environment empty); npm 11.5.1 or later,
# which Node 24 includes. A tag push publishes to npm from the approval-gated
# `npm` environment.
#
# ClawHub, through ClawHub's reusable package-publish workflow (pinned to a
# release commit), also through trusted publishing only: ClawHub's trusted
# publisher for @empiriolabs/openclaw-provider is this repository and
# publish.yml, and ClawHub accepts a secretless publish only from a
# workflow_dispatch run. After the tag push, run this workflow on the tag
# ("Run workflow", choose the tag) and approve the `clawhub` environment. The
# package scope @empiriolabs matches the ClawHub publisher handle `empiriolabs`.
#
# The tag must equal the version in package.json.

name: Publish

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check the tag and the version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          constant="$(grep -o 'PACKAGE_VERSION = "[^"]*"' src/constants.ts | cut -d'"' -f2)"
          if [ "$constant" != "$version" ]; then
            echo "::error::src/constants.ts PACKAGE_VERSION ($constant) does not match package.json ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build and regenerate the offline fallback from the live catalog
        run: |
          npm run build
          npm run generate:fallback
          npm run build

      - name: Typecheck and run unit tests
        run: |
          npm run typecheck
          npm test

      - name: Check the packed plugin with the OpenClaw Plugin Inspector
        # Fails on breakages, warnings, and deprecated Plugin SDK APIs.
        run: npm run inspect

      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          tar -tzf "$tarball"

      - name: Validate with the ClawHub plugin inspector
        run: npx --yes clawhub@0.23.3 package validate .

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tgz
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  npm:
    name: Publish to npm
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Lets npm request an OIDC token for trusted publishing and the provenance signature.
      id-token: write
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check the npm version
        run: |
          npm_version="$(npm --version)"
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$npm_version"; then
            echo "::error::npm $npm_version is too old for trusted publishing; 11.5.1 or later is required"
            exit 1
          fi

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tgz

      - name: Publish with provenance
        # npm authenticates through trusted publishing only (OIDC, no secret).
        run: npm publish "./$TARBALL" --access public --provenance
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}

  clawhub-approval:
    name: Approve the ClawHub publish
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: clawhub
    steps:
      - name: Approved
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: echo "Publishing $VERSION to ClawHub"

  clawhub:
    name: Publish to ClawHub
    if: github.event_name == 'workflow_dispatch'
    needs: [build, clawhub-approval]
    permissions:
      actions: read
      contents: read
      id-token: write # ClawHub trusted publishing
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@cacf5ec1b0ee3cb532ab4555a68c1db9e0c1aac7 # v0.24.0
    with:
      dry_run: false
      owner: empiriolabs
      package_artifact_name: package-tgz
      changelog: "See CHANGELOG.md for version ${{ needs.build.outputs.version }}."
